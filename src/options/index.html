<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MW Quick Lookup — Settings</title>
    <link rel="stylesheet" href="../theme/theme.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--canvas); padding: 40px 24px; color: var(--text); }

      .opts-shell { max-width: 520px; margin: 0 auto; background: var(--surface); border-radius: 10px; padding: 32px; box-shadow: var(--shadow); }

      .opts-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }

      .opts-desc { font-size: 14px; color: var(--secondary); line-height: 1.6; margin-bottom: 28px; }
      .opts-desc a { color: var(--link); }

      .opts-form { display: flex; flex-direction: column; gap: 12px; }

      .opts-label { font-size: 13px; font-weight: 600; color: var(--secondary); }

      .opts-input {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 14px;
        outline: none;
        width: 100%;
      }

      .opts-input:focus { border-color: var(--link); }

      .opts-actions { display: flex; align-items: center; gap: 12px; margin-top: 8px; }

      .opts-save-btn {
        background: var(--button);
        color: var(--button-text);
        border: none;
        border-radius: 6px;
        padding: 8px 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .opts-save-btn:hover { background: var(--button-hover); }

      .opts-saved { font-size: 13px; color: var(--success); font-weight: 600; }

      .opts-fieldset { border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
      .opts-fieldset legend { padding: 0 4px; }
      .opts-radio-group { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
      .opts-radio-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--secondary); cursor: pointer; }
      .opts-radio-label input { cursor: pointer; }
      .opts-checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--secondary); cursor: pointer; margin-top: 8px; }
      .opts-checkbox-label input { cursor: pointer; width: 15px; height: 15px; }
      .opts-hint { font-size: 12px; color: var(--secondary); margin-top: 8px; line-height: 1.5; }
      .opts-hint code { background: var(--hover); padding: 1px 4px; border-radius: 3px; font-size: 11px; }
      .opts-lang-row { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
      .opts-lang-input { max-width: 80px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
